server:
  port: 8058

spring:
  application:
    name: inventory-service

  # Shared settings of every OMS service (springdoc, AWS client): oms-core's application-core.yaml.
  # A profile file wins over this file, so override those values with an environment variable or a later profile.
  profiles:
    include: core

  datasource:
    url: jdbc:postgresql://localhost:5432/inventory?currentSchema=inventory
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
        query:
          in_clause_parameter_padding: true
        show_sql: true
        jdbc:
          batch_size: 50

  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:5432/inventory?currentSchema=inventory
    user: postgres
    password: postgres

  cloud:
    aws:
      region:
        static: eu-west-1
      credentials:
        access-key: test
        secret-key: test
      endpoint: http://localhost:4566

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: product-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
aws:
  # region, endpoint, access-key and secret-key come from oms-core's application-core.yaml (profile `core`, included above).
  sqs:
    queues:
      reservation-expire: ${AWS_SQS_RESERVATION_EXPIRE_QUEUE:localdev-reservation-expire-queue}

app:
  kafka:
    # Replication factor of the dead-letter topics (ProductCreated.DLT, ProductUpdated.DLT, ReserveStock.DLT,
    # ConfirmStockReservation.DLT, ReleaseStockReservation.DLT); 3 in production.
    dlt-replicas: ${KAFKA_DLT_REPLICAS:1}
    stock-commands:
      # Listener threads per command topic (ReserveStock, ConfirmStockReservation, ReleaseStockReservation; 6 partitions
      # each). Every thread can hold a database connection, next to 2 catalog listeners and the expiry sweep: keep
      # 3 x concurrency + 3 below the Hikari pool (10), which also serves REST. With 1, a command that is being retried
      # delays the other partitions of its topic on this instance.
      # The listeners poll 5 records at a time (max.poll.records on @KafkaListener): 5 x (20 s connection wait + 10 s
      # transaction timeout + 1 s) + a 60 s backoff = 215 s, under max.poll.interval.ms (300 s), so a slow database
      # does not cause a rebalance. Re-check that sum when one of those settings changes.
      concurrency: ${STOCK_COMMANDS_CONCURRENCY:1}
  reservation-expiry:
    # Reservations expired per page of the sweep.
    batch-size: ${RESERVATION_EXPIRY_BATCH_SIZE:500}
    # Stop starting new pages after this; at most the listener visibility timeout (90 s) minus 30 s for the last page.
    time-budget: ${RESERVATION_EXPIRY_TIME_BUDGET:PT40S}
    # Ticks older than this are dropped if this instance swept recently; must be longer than the 1-minute schedule
    # plus time-budget (a tick can wait behind a running sweep).
    max-tick-age: ${RESERVATION_EXPIRY_MAX_TICK_AGE:PT2M}
  reservation:
    # Stock commands (ADR 0006). Hold time of a reservation (BR-INV-02); at most 24 hours.
    ttl: ${RESERVATION_TTL:PT15M}
    # Lines per ReserveStock (BR-INV-11), 1..100.
    max-lines: ${RESERVATION_MAX_LINES:100}
    # Clock skew accepted by the stale-command check (BR-INV-11); shorter than ttl.
    clock-skew-tolerance: ${RESERVATION_CLOCK_SKEW_TOLERANCE:PT30S}
    # SET LOCAL lock_timeout / statement_timeout of a command transaction; must be lock < statement < transaction.
    lock-timeout: ${RESERVATION_LOCK_TIMEOUT:PT3S}
    statement-timeout: ${RESERVATION_STATEMENT_TIMEOUT:PT5S}
    # Also read by @Transactional(timeoutString) of the reserve / confirm / release use cases.
    transaction-timeout-seconds: ${RESERVATION_TRANSACTION_TIMEOUT_SECONDS:10}

  swagger:
    title: Inventory Service API
    version: v1
    description: Inventory service REST API

logging:
  pattern:
    # MDC (requestId, merchantId, storeId, kafka*/sqs* ...) in front of every line; see oms-core MdcKeys.
    correlation: "[%X] "
  level:
    root: INFO
    org:
      hibernate:
        SQL: OFF
        orm:
          jdbc:
            bind: OFF
