server:
  port: 8058

spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:postgresql://localhost:5432/inventory?currentSchema=inventory
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
        query:
          in_clause_parameter_padding: true
        show_sql: true
        jdbc:
          batch_size: 50

  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:5432/inventory?currentSchema=inventory
    user: postgres
    password: postgres

  cloud:
    aws:
      region:
        static: eu-west-1
      credentials:
        access-key: test
        secret-key: test
      endpoint: http://localhost:4566

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: product-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
aws:
  # For local development with LocalStack
  # endpoint: http://localhost:4566
  region: ${AWS_REGION:eu-west-1}
  endpoint: ${AWS_ENDPOINT:http://localhost:4566}
  access-key: ${AWS_ACCESS_KEY:test}
  secret-key: ${AWS_SECRET_KEY:test}

  dynamodb:
    table:
      merchant-info: ${AWS_DYNAMODB_TABLE:localdev_merchant_info}
  sqs:
    queues:
      reservation-expire: ${AWS_SQS_RESERVATION_EXPIRE_QUEUE:localdev-reservation-expire-queue}

app:
  reservation-expiry:
    # Reservations expired per page of the sweep.
    batch-size: ${RESERVATION_EXPIRY_BATCH_SIZE:500}
    # Stop starting new pages after this; at most the listener visibility timeout (90 s) minus 30 s for the last page.
    time-budget: ${RESERVATION_EXPIRY_TIME_BUDGET:PT40S}
    # Ticks older than this are dropped if this instance swept recently; must be longer than the 1-minute schedule
    # plus time-budget (a tick can wait behind a running sweep).
    max-tick-age: ${RESERVATION_EXPIRY_MAX_TICK_AGE:PT2M}

  swagger:
    title: Inventory Service API
    version: v1
    description: Inventory service REST API

logging:
  level:
    root: INFO
    org:
      hibernate:
        SQL: OFF
        orm:
          jdbc:
            bind: OFF